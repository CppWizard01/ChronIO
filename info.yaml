# Tiny Tapeout project information
project:
  title:        "ChronIO Protocol Emulator"
  author:       "Dhairya Sharma"
  discord:      ""
  description:  "4-Lane Barrel Timed-I/O Protocol Emulator ASIC with 4KB Instruction SRAM"
  language:     "Verilog"
  clock_hz:     60000000

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_chronio"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "sram_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "HOST_SCK / IN0"
  ui[1]: "HOST_CS_N / IN1"
  ui[2]: "HOST_MOSI / IN2"
  ui[3]: "IN3"
  ui[4]: "IN4"
  ui[5]: "IN5"
  ui[6]: "IN6"
  ui[7]: "IN7"

  # Outputs
  uo[0]: "HOST_MISO / OUT0"
  uo[1]: "HOST_IRQ / OUT1"
  uo[2]: "OUT2"
  uo[3]: "OUT3"
  uo[4]: "OUT4"
  uo[5]: "OUT5"
  uo[6]: "OUT6"
  uo[7]: "OUT7"

  # Bidirectional pins
  uio[0]: "IO0"
  uio[1]: "IO1"
  uio[2]: "IO2"
  uio[3]: "IO3"
  uio[4]: "IO4"
  uio[5]: "IO5"
  uio[6]: "IO6"
  uio[7]: "IO7"

# Do not change!
yaml_version: 6
